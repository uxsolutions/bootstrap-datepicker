name: CI

on:
    [push, pull_request]

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v5
            -   uses: actions/setup-node@v5

            -   name: Install grunt
                run: yarn global add grunt-cli

            -   name: Install dependencies
                run: yarn

            -   name: Run tests
                run: yarn test
